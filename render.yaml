projects:
  - name: web-key-value
    environments:
      - name: production
        services:
          - type: web
            name: web-key-value
            runtime: go
            region: oregon
            plan: 0.5c-512mb
            branch: main
            buildCommand: go build -o bin/web-key-value .
            startCommand: ./bin/web-key-value
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: web-key-value-store
                  property: connectionString
              - key: WRITE_SECRET
                generateValue: true

          - type: keyvalue
            name: web-key-value-store
            region: oregon
            plan: 256mb
            maxmemoryPolicy: noeviction
            persistenceMode: journal-snapshot
            ipAllowList: []
